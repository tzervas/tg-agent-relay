# Fleet security lint/scan — self-hosted. Badge reflects honest job status on trunk.
# Hardened: least privileges, pinned gitleaks + SHA256, no unauthenticated :latest.
# Usability: PR/push scan working tree (tip); weekly schedule scans full git history.
name: fleet-security

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency:
  group: fleet-security-${{ github.ref }}
  # A scheduled self-hosted run must never be cancel-in-progress. A queued
  # schedule gets cancelled by the next event on the same ref and reports
  # "cancelled" — which is neither pass nor fail, so the gate silently never
  # runs and nothing goes red to say so. Same class of decorative gate as the
  # `continue-on-error` this PR removes below, arriving by a different route.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}
          persist-credentials: false

      - name: Ensure gitleaks (pinned + checksum)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION="8.30.1"
          GITLEAKS_SHA256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          if command -v gitleaks >/dev/null 2>&1; then
            echo "using preinstalled $(command -v gitleaks) ($(gitleaks version 2>/dev/null || true))"
            exit 0
          fi
          install_dir="${RUNNER_TEMP:-/tmp}/gitleaks-bin"
          mkdir -p "$install_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          tmp="${RUNNER_TEMP:-/tmp}/${archive}"
          curl -fsSL "$url" -o "$tmp"
          echo "${GITLEAKS_SHA256}  ${tmp}" | sha256sum -c -
          tar -xzf "$tmp" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/gitleaks" version

      - name: Run gitleaks
        run: |
          set -euo pipefail
          if ! command -v gitleaks >/dev/null 2>&1; then
            echo "gitleaks not available after install — FAIL (honest security gate)" >&2
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            gitleaks detect --source . --verbose --redact --exit-code 1
          else
            gitleaks detect --source . --no-git --verbose --redact --exit-code 1
          fi

  trivy-fs:
    # Required security gate: real vuln+secret+license scan. Prefer trivy from
    # runner-base (GHA_IMAGE); until hosts seed that image, install a pinned
    # checksum-verified release tarball into $RUNNER_TEMP (no sudo — rootless
    # podman sets no_new_privs). Hard-fail only if still missing after ensure.
    name: trivy filesystem (vuln+secret+license)
    runs-on: [self-hosted, linux, x64, podman]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Ensure trivy (pinned + checksum)
        run: |
          set -euo pipefail
          # Pin aligns with ap-workflows runner-base / security-validate.yml.
          TRIVY_VERSION="0.72.0"
          TRIVY_SHA256="bbb64b9695866ce4a7a8f5c9592002c5961cab378577fa3f8a040df362b9b2ea"
          if command -v trivy >/dev/null 2>&1; then
            echo "using preinstalled $(command -v trivy) ($(trivy --version 2>/dev/null | head -1 || true))"
            exit 0
          fi
          # NO sudo. Rootless podman + no_new_privs cannot apt-install.
          # PREFERRED: bake trivy into runner-base; this block short-circuits then.
          install_dir="${RUNNER_TEMP:-/tmp}/trivy-bin"
          mkdir -p "$install_dir"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          tmp="${RUNNER_TEMP:-/tmp}/${archive}"
          curl -fsSL "$url" -o "$tmp"
          echo "${TRIVY_SHA256}  ${tmp}" | sha256sum -c -
          tar -xzf "$tmp" -C "$install_dir" trivy
          chmod 0755 "$install_dir/trivy"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/trivy" --version

      - name: Trivy fs
        run: |
          set -euo pipefail
          command -v trivy >/dev/null 2>&1 || {
            echo "trivy missing from runner image" >&2
            exit 1
          }
          trivy fs --scanners vuln,secret,license \
            --severity HIGH,CRITICAL \
            --skip-dirs .git --skip-dirs target --skip-dirs node_modules --skip-dirs .venv \
            --exit-code 1 \
            .
