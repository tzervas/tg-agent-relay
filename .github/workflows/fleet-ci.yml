# Fleet standard CI — self-hosted. Honest status on trunk via Actions badge.
# See docs/FLEET_STANDARDS.md (or plans/fractal/P26_FLEET_STANDARDS.md).
name: fleet-ci

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

concurrency:
  group: fleet-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: detect stack
    runs-on: [self-hosted, linux, x64, podman]
    outputs:
      rust: ${{ steps.d.outputs.rust }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          set -euo pipefail
          rust=false; python=false
          # Real Rust crate or non-empty workspace members only.
          # Empty virtual workspaces (members = []) must not enable cargo jobs.
          # Ignore comments (e.g. "# Future: members = [\"crates/...\"]").
          if [ -f Cargo.toml ]; then
            if grep -qE '^\[package\]' Cargo.toml; then
              rust=true
            elif grep -vE '^\s*#' Cargo.toml \
              | grep -qE 'members\s*=\s*\[[^]]*["'\''][^"'\'']'; then
              rust=true
            elif find . -path ./target -prune -o -name Cargo.toml -print 2>/dev/null \
              | grep -v '^\./Cargo.toml$' | head -1 | grep -q .; then
              rust=true
            fi
          fi
          if [ -f pyproject.toml ] || [ -f requirements.txt ] || [ -f setup.py ]; then python=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "Detected rust=$rust python=$python"

  rust:
    name: cargo check/test
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace

  python:
    name: python lint/test
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
      - name: Sync dependencies
        run: |
          set -euo pipefail
          if [ -f uv.lock ] || [ -f pyproject.toml ]; then
            if ! uv sync --all-groups; then
              echo "::warning title=DEGRADED_ENV::uv sync --all-groups failed; retrying without dev groups. Lint/test tooling may be missing — the steps below fail closed if it is."
              uv sync
            fi
          fi
      - name: Ruff (if configured)
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ] && grep -q '\[tool.ruff' pyproject.toml 2>/dev/null; then
            # No `|| python -m ruff check .` fallback. That `||` fired on ANY
            # non-zero exit, so "ruff found problems" and "ruff is not installed"
            # took the same branch — and a real lint failure could be laundered
            # into a pass by a second interpreter resolving different config.
            # A configured linter that cannot run is an environment failure, not
            # a clean lint.
            if ! uv run ruff --version >/dev/null 2>&1; then
              echo "::error title=FAIL_ENV::[tool.ruff] is configured but ruff is not runnable after sync"
              exit 1
            fi
            uv run ruff check .
          else
            echo "ruff not configured — skip"
          fi
      - name: Pytest (if tests exist)
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ]; then
            if command -v uv >/dev/null 2>&1 && [ -f pyproject.toml ]; then
              uv run pytest -q
            elif command -v pytest >/dev/null 2>&1; then
              pytest -q
            else
              echo "::error title=FAIL_ENV::pytest not available after env setup"
              exit 1
            fi
          else
            echo "no tests/ directory — skip"
          fi

  noop:
    name: fleet-ci stub (no stack — not a product gate)
    needs: detect
    if: needs.detect.outputs.rust != 'true' && needs.detect.outputs.python != 'true'
    runs-on: [self-hosted, linux, x64, podman]
    steps:
      - run: |
          echo "::notice title=SKIP_STUB::No Cargo.toml / pyproject detected; fleet-ci stub is not a product gate"
          echo "HONEST_CI class=SKIP_STUB detail=no_stack_detected"
          echo "Add stack files or a product-specific CI job for real coverage."
