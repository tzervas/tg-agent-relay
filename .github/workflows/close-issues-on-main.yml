# Close Fixes/Closes issues only when a PR merges into **main** (or master).
# Feature PRs target **dev** and must leave issues open (use Refs #n).
# Epics close only when a main-bound PR includes Closes #<epic>.
name: close-issues-on-main

on:
  pull_request:
    types: [closed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number (must be merged into main)"
        type: string
        required: true
      dry_run:
        description: "List issues without closing"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked:
    name: Close issues for main merge
    # Meta workflow: GitHub-hosted is correct (issue API only; no product build).
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       (github.event.pull_request.base.ref == 'main' ||
        github.event.pull_request.base.ref == 'master'))
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GitHub CLI (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          # NO sudo. The podman runner is rootless and sets no_new_privs, so
          # sudo cannot escalate there at all:
          #   "sudo: The \"no new privileges\" flag is set, which prevents sudo
          #    from running as root."
          # An apt install can therefore never succeed on that runner, whatever
          # the packaging. Install the release tarball into a writable directory
          # on PATH instead — no root required, works on hosted and self-hosted.
          #
          # PREFERRED FIX: bake gh into the runner base image. Then the check
          # above short-circuits and none of the following runs. This block is
          # the fallback that keeps CI green until the image ships it.
          case "$(uname -m)" in
            x86_64|amd64)  ARCH=amd64 ;;
            aarch64|arm64) ARCH=arm64 ;;
            *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
          esac
          # Resolved at job time rather than pinned: a stale pin here silently
          # rots, and the runner has working network to the API.
          VER="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   https://api.github.com/repos/cli/cli/releases/latest \
                 | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p' | head -1)"
          if [ -z "$VER" ]; then
            echo "::error::could not resolve a gh release version — bake gh into the runner image"
            exit 1
          fi
          TB="gh_${VER}_linux_${ARCH}.tar.gz"
          BASE="https://github.com/cli/cli/releases/download/v${VER}"
          TMP="$(mktemp -d)"
          curl -fsSL -o "$TMP/$TB" "$BASE/$TB"
          curl -fsSL -o "$TMP/sums" "$BASE/gh_${VER}_checksums.txt"
          ( cd "$TMP" && grep " $TB$" sums | sha256sum -c - )
          tar -xzf "$TMP/$TB" -C "$TMP"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 0755 "$TMP/gh_${VER}_linux_${ARCH}/bin/gh" "$RUNNER_TEMP/bin/gh"
          rm -rf "$TMP"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/gh" --version

      - name: Close linked issues (main only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          DRY_INPUT: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/close-linked-issues.sh ]; then
            echo "scripts/close-linked-issues.sh missing — fail" >&2
            exit 1
          fi
          args=(--pr "$PR_NUMBER")
          if [ "${DRY_INPUT}" = "true" ]; then args+=(--dry-run); fi
          # Prefer main; allow master via RELAY_MAIN_BRANCH if needed
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          if [ "$DEFAULT_BRANCH" = "master" ]; then
            args+=(--main-branch master)
          fi
          bash scripts/close-linked-issues.sh "${args[@]}"
